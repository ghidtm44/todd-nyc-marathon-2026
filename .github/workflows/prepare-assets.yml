name: Prepare official course assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-assets.yml'
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NYRR published course inputs
        run: |
          mkdir -p source
          curl --fail --location --retry 2 'https://cms.prod.nyrr.org/api/document-files/file/TCSNYCM26_Map_Course_090226_RD3.pdf' -o source/official-course-2026.pdf
          curl --fail --location --retry 2 'https://www.google.com/maps/d/kml?mid=1pHIR8TGIl2liF3A2oR52Z1RPPi_una0&forcekml=1' -o source/official-course-2026.kml
      - name: Preserve official inputs for static build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/official-course-2026.pdf source/official-course-2026.kml
          git diff --cached --quiet || git commit -m 'Preserve official 2026 NYRR course inputs'
          git push
