name: Verify static spectator page
on:
  push:
    branches: [main]
    paths: ['index.html', 'style.css', 'assets/**', 'source/**', 'scripts/**', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify static estimates and assets
        run: python3 scripts/verify_static.py
      - name: Install CI browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/todd-browser-qa" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/todd-browser-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check mobile and desktop layout
        env:
          NODE_PATH: ${{ runner.temp }}/todd-browser-qa/node_modules
        run: node scripts/verify_browser.cjs
      - name: Retain internal QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectator-page-qa
          path: qa-output/
          retention-days: 7
          if-no-files-found: ignore
